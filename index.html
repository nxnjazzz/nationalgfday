<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Happy National Girlfriend Day ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Hearts -->

<div id="hearts"></div>

<!-- Sparkles -->

<div id="sparkles"></div>

<!-- Loading -->

<div id="loading">

<h2>Preparing your surprise...</h2>

<div class="loaderHeart">💖</div>

</div>

<!-- Envelope Screen -->

<section id="intro" class="hidden">

<div class="envelopeContainer">

<div class="envelope" id="envelope">

<div class="envelopeBack"></div>

<div class="letter">

<h2>To My Beautiful Girlfriend ❤️</h2>

<p>Open me 💌</p>

</div>

<div class="envelopeFront"></div>

<div class="flap"></div>

<div class="seal" onclick="openEnvelope()">

❤️

</div>

</div>

</div>

</section>

<!-- Main -->

<main id="mainPage">

<header>

<h1 id="title"></h1>

<p class="subtitle">

Happy National Girlfriend Day

</p>

</header>

<section class="musicSection">

<div class="recordPlayer">

<img
src="images/vinyl.gif"
id="record"
alt="vinyl">

</div>

<div class="controls">

<h3>Now Playing</h3>

<p>Your Song ❤️</p>

<button id="musicButton" onclick="toggleMusic()">

▶ Play

</button>

</div>

<audio id="music" loop>

<source src="music/song.mp3" type="audio/mpeg">

</audio>

</section>

<section class="gallery">

<img
src="images/collage.png"
class="collage"
alt="Our Memories">

</section>

<section class="buttons">

<button onclick="showLetter()">

💌 Read My Letter

</button>

</section>

<!-- Letter -->

<div id="letterOverlay">

<div class="letterCard">

<span class="close" onclick="closeLetter()">

×

</span>

<h2>My Love ❤️</h2>

<div id="typedLetter"></div>

</div>

</div>

<footer>

<p>

Made with ❤️ just for you.

</p>

</footer>

</main>

<script src="script.js"></script>

</body>
</html>
